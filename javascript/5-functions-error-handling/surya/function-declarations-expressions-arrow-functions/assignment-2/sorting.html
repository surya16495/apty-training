<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Expression for Sorting</title>
</head>
<body>
    <h1>Sorting using Function Expression</h1>
    <form action="#" id="form">
        <label for="values">Enter Array values :</label>
        <input type="text" id="values">
        <br><br>
        <button type="submit">Sort</button>
    </form>
    <br><br>
    <table id="resultTable" border="1">
        <thead>
            <tr>
                <th>Sorted Numbers</th>
            </tr>
        </thead>
        <tbody id="result">

        </tbody>
    </table>
    <script src="./scripts/index.js"></script>
</body>
</html>
