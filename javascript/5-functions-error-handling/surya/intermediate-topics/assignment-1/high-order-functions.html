<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Higher-Order Functions</title>
  </head>
  <body>
    <h1>Repeat Action</h1>
    <form id="repeat-action-form">
      <label for="item-text">Enter Text for List Items:</label>
      <input type="text" id="item-text" name="item-text" />
      <br /><br>
      <label for="repeat-count">Number of Times:</label>
      <input type="number" id="repeat-count" name="repeat-count" />
      <br /><br>
      <button type="submit">Generate List</button>
    </form><br>
    <h2>Generated List</h2>
    <ul id="item-list"></ul>
    <p id="caution"></p>
    <script src="./scripts/index.js"></script>
  </body>
</html>
