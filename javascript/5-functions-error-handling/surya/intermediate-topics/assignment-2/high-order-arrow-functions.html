<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Order Functions with Arrow Functions</title>
</head>
<body>
    <h1>High Order Functions with Arrow Functions</h1>
    <form id="filter-form">
      <label for="number-array">Enter Numbers (comma-separated):</label>
      <input type="text" id="number-array" name="number-array" />
      <br /><br>
      <label for="limit">Filter Limit (remove numbers greater than):</label>
      <input type="number" id="limit" name="limit" />
      <br /><br>
      <button type="submit">Filter</button>
    </form><br>
    <p>Filtered Array: <span id="filtered-output"></span></p>
    <p id="caution"></p>
    <script src="./scripts/index.js"></script>
</body>
</html>
