<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Private Variables with Closures</title>
  </head>
  <body>
    <h1>Private Variables with Closures</h1>
    <label for="deposit">Deposit Amount:</label>
    <input type="number" id="deposit" placeholder="100" />
    <br><br>
    <button onclick="task(event)" name="deposit">Deposit Money</button>
    <br><br>
    <label for="withdraw">Withdraw Amount:</label>
    <input type="number" id="withdraw" placeholder="100" />
    <br><br>
    <button onclick="task(event)" name="withdraw">
      Withdraw Money
    </button>
    <br><br>
    <button onclick="task(event)" name="checkBalance">Check Balance Function</button>
    <br><br>
    <p id="action"></p>

    <script src="./scripts/index.js"></script>
  </body>
</html>
