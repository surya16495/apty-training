<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Array Flattening Function</title>
</head>
<body>
    <h1>Custom Array Flattening Function</h1>
    <form action="#" id="form">
        <label for="arrayInput">Enter a nested array:</label>
        <br><br>
        <textarea id="arrayInput" rows="4" cols="50" placeholder="Ex : [1, 2, [3, 5], [5, [6,7]]]"></textarea>
        <br><br>
        <button type="submit">Flatten Array</button>
    </form>
    <h2>Flattened Array:</h2>
    <pre id="result"></pre>
    <script src="./scripts/custom-array-flattening.js"></script>
</body>
</html>
