<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Removing Duplicates from an array</title>
</head>
<body>
    <h1>Removing Duplicates from an Array</h1>
    <form action="#" id="form">
        <label for="array-elements">Enter any array :</label><br><br>
        <textarea name="array-elements" id="array-elements" rows="5" cols="50" placeholder="Ex : [1, 2, 3, 4, 5]"></textarea>
        <br><br>
        <button type="submit">Remove Duplicates</button>
    </form>
    <h3>The Result is :</h3>
    <p id="result"></p>
    <script src="./scripts/index.js"></script>
</body>
</html>
