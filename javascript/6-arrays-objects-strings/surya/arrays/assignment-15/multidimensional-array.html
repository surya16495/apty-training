<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Dimensional Array</title>
  </head>
  <body>
    <h1>Multi-Dimensional Array</h1>
    <form action="#" id="form">
      <label for="array-elements">Enter any 2D array :</label><br /><br />
      <textarea
        name="array-elements"
        id="array-elements"
        rows="5"
        cols="50"
        placeholder="Ex : [ [1, 2, 3], [4, 5, 6], [7, 8, 9] ]"
      ></textarea>
      <br /><br />
      <button type="submit">Transpose</button>
    </form>
    <h3>The Transpose of matrix is :</h3>
    <p id="result"></p>
    <script src="./scripts/index.js"></script>
  </body>
</html>
