<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Data Structure</title>
</head>
<body>
    <h1>Stack Data Structure</h1>
    <form action="#" id="form">
        <label for="stackInput">Enter elements to push onto the stack (comma-separated):</label>
        <br><br>
        <input type="text" id="stackInput" placeholder="Ex: 1, 2, 3">
        <br><br>
        <button type="submit">Push to Stack</button>
        <button type="button" id="popButton">Pop from Stack</button>
        <button type="button" id="peekButton">Peek at Stack</button>
    </form>
    <h2>Stack Contents:</h2>
    <pre id="stackContents"></pre>
    <p id="result"></p>
    <script src="../javascript/stack-data-structure.js"></script>
</body>
</html>
