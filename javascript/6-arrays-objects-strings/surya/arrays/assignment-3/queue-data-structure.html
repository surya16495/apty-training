<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queue Data Structure</title>
  </head>
  <body>
    <h1>Queue Data Structure</h1>
    <form action="#" id="form">
      <label for="queueInput"
        >Enter elements to add into the queue (comma-separated):</label
      >
      <br /><br />
      <input type="text" id="queueInput" placeholder="Ex: 1, 2, 3" />
      <br /><br />
      <button type="submit">Enqueue</button>
      <button type="button" id="dequeueButton">Dequeue</button>
      <button type="button" id="peekButton">Peek at Queue</button>
    </form>
    <h2>Queue Contents:</h2>
    <pre id="queueContents"></pre>
    <p id="result"></p>
    <script src="./scripts/index.js"></script>
  </body>
</html>
