<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map and Filter</title>
</head>
<body>
    <h1>Map and Filter</h1>
    <form action="#" id="form">
        <label for="tasks-details">Enter tasks status as array of objects :</label><br><br>
        <textarea name="tasks-details" id="tasks-details" rows="5" cols="50" placeholder="Ex : [{task: 'A', completed: true}, {task: 'B', completed: false}, {task: 'C', completed: true}]"></textarea>
        <br><br>
        <button type="submit">check</button>
    </form>
    <h3>The completed tasks are :</h3>
    <p id="result"></p>
    <script src="./scripts/index.js"></script>
</body>
</html>
