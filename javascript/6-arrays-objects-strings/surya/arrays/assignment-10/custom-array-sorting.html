<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Array Sorting</title>
</head>
<body>
    <h1>Custom Array Sorting</h1>
    <form action="#" id="form">
        <label for="array-objects">Enter any array of objects :</label><br><br>
        <textarea name="array-objects" id="array-objects" rows="5" cols="50" placeholder="Ex : [{ name: 'Bob', score: 80 }, { name: 'Alice', score: 90 }]"></textarea>
        <br><br>
        <button type="submit">Sort</button>
    </form>
    <h3>The Results are :</h3>
    <p id="result"></p>
    <script src="./scripts/index.js"></script>
</body>
</html>
