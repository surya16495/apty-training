<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrolling</title>
    <link rel="stylesheet" href="./styles/index.css">
</head>
<body>
    <div class="container">
        <h1>Scrolling</h1>
        <label for="direction-x">Enter Position on X-axis :</label>
        <input type="number" id="direction-x">
        <br><br>
        <label for="direction-y">Enter Position on Y-axis :</label>
        <input type="number" id="direction-y">
        <br><br>
        <button id="go">Go to given position</button>
        <button id="up">Scroll Up</button>
        <button id="down">Scroll Down</button>
    </div>
    <div class="container-2"></div>
    <div class="container-3"></div>
    <script src="./scripts/index.js"></script>
</body>
</html>
