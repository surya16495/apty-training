<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timers</title>
  </head>
  <body>
    <div>
      <h3>Countdown Timer</h3>
      <input type="number" id="countdown-input" placeholder="Enter seconds" />
      <button id="start-countdown">Start Countdown</button>
      <p id="countdown-display">0</p>
    </div>
    <div>
      <h3>Stopwatch</h3>
      <p id="stopwatch-display">0</p>
      <button id="start-stopwatch">Start</button>
      <button id="stop-stopwatch">Stop</button>
      <button id="reset-stopwatch">Reset</button>
    </div>
    <script src="./scripts/index.js"></script>
  </body>
</html>
