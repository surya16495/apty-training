<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookies</title>
  </head>
  <body>
    <h1>Cookies</h1>
    <div class="container">
      <input type="text" id="cookieName" placeholder="Cookie Name" />
      <input type="text" id="cookieValue" placeholder="Cookie Value" />
      <input type="number" id="cookieDays" placeholder="Expiry in Days" />

      <button onclick="setCookieBtn()">Set Cookie</button>
      <button onclick="getCookieBtn()">Get Cookie</button>
      <button class="delete" onclick="deleteCookieBtn()">Delete Cookie</button>

      <div class="output" id="output">No action yet.</div>
    </div>

    <script src="./scripts/index.js"></script>
  </body>
