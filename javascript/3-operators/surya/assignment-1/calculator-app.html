<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator App</title>
  </head>
  <body>
    <h1>Calculator</h1>

    <input
      type="number"
      name="number-1"
      value="number-1"
      placeholder="Enter 1st number"
      id="number_1"
    />
    <br />
    <input
      type="number"
      name="number-2"
      value="number-2"
      placeholder="Enter 2nd number"
      id="number_2"
    />
    <br />
    <button>+</button>
    <button>-</button>
    <button>*</button>
    <button>/</button>
    <button>%</button>
    <button>++</button>
    <button>--</button>
    <script src="./scripts/index.js"></script>
  </body>
</html>
