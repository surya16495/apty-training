<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitwise Operators</title>
  </head>
  <body>
    <h1>Bitwise Operators</h1>
    <label for="value1">Value 1 :</label>
    <input type="number" id="value1" placeholder="value1" required />
    <br />
    <br />
    <label for="value2">Value 2:</label>
    <input type="number" id="value2" placeholder="value2" required />
    <br />
    <br />
    <button onclick="bitwiseAnd()">&</button>
    <button onclick="bitwiseOr()">|</button>
    <button onclick="bitwiseXor()">^</button>
    <button onclick="bitwiseNot()">~</button>
    <button onclick="bitwiseLeftShift()">&lt;&lt;</button>
    <button onclick="bitwiseRightShift()">&gt;&gt;</button>
    <br /><br />
    <p id="output"></p>
    <script src="./scripts/index.js"></script>
  </body>
</html>
