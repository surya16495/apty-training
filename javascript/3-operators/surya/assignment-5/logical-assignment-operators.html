<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <h1>Logical Operators</h1>
    <label for="value1">value-1 :</label>
    <input type="text" id="value1" placeholder="Value1" required>
    <select name="type1" id="type1">
        <option value="number" selected>number</option>
        <option value="string">string</option>
        <option value="boolean">boolean</option>
        <option value="undefined">undefined</option>
        <option value="null">null</option>
        <option value="object">object</option>
    </select>
    <br>
    <br>
    <label for="value2">value-2 :</label>
    <input type="text" id="value2" placeholder="Value2" required>
    <select name="type2" id="type2">
        <option value="number" selected>number</option>
        <option value="string">string</option>
        <option value="boolean">boolean</option>
        <option value="undefined">undefined</option>
        <option value="null">null</option>
        <option value="object">object</option>
    </select>
    <br>
    <br>
    <button onclick="logicalAndAssignment()">&&=</button>
    <button onclick="logicalOrAssignment()">||=</button>
    <button onclick="nullishCoalescing()">??=</button>
    <br>
    <br>
    <p id="result"></p>
