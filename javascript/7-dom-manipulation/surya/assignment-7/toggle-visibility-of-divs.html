<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggling Visibility of Divs</title>
    <style>
        div{
            height: 100px;
            width: 100px;
            text-align: center;
            color: black;
            margin: 20px;
        }
        #div1{
            background-color:blue;
        }
        #div2{
            background-color:green;
        }
        #div3{
            background-color:yellow;
        }
    </style>
</head>
<body>
    <h1>Toggling visibility of Divs</h1>
    <div id="div1">
        div 1
    </div>
    <div id="div2">
        div 2
    </div>
    <div id="div3">
        div 3
    </div>
    <button onclick="toggleDivs()">Toggle Divs</button>
    <script src="./scripts/index.js"></script>
</body>
</html>
