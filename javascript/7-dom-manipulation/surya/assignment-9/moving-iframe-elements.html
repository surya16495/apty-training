<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Table in Iframe</title>
    <style>
			iframe {
				width: 80%;
				height: 500px;
				border: 1px solid black;
			}
			button {
				margin: 5px;
			}
		</style>
</head>
<body>
    <h1>Control Table in Iframe</h1>
    <iframe id="tableIframe" style="width:100%; height:400px;"></iframe>
    <div class="controls">
        <button id="btnUp">Up</button>
        <button id="btnDown">Down</button>
        <button id="btnTop">Move Top</button>
        <button id="btnBottom">Move Bottom</button>
    </div> 
    <script src="./scripts/index.js"></script>
</body>
</html>
